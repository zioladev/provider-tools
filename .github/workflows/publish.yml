name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (build + pack, do NOT publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write               # enables npm provenance (a supply-chain receipt)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish (or dry-run)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — packing only, not publishing"
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
